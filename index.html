    <style>
        /* รีเซ็ตค่าขอบและระยะห่าง */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19; /* สีพื้นหลังโทนเข้ม หรูหรา */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* โครงสร้างหน้าจอมือถือความกว้างไม่เกิน 480px */
        .container {
            max-width: 480px;
            width: 100%;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            /* ป้องกันการเกิดช่องว่างสีขาวระหว่างรูปภาพ */
            font-size: 0;
            line-height: 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* แสดงผลภาพให้เต็มความกว้างและคมชัดแบบ Crisp-edges */
        img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            outline: none;
            /* คุณสมบัติบังคับเรนเดอร์ขอบภาพให้คมชัด ไม่เบลอ */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* ตกแต่งรูปที่ 3 ให้เป็นปุ่มที่ตอบสนองการกด */
        .image-button {
            display: block;
            text-decoration: none;
            outline: none;
            transition: transform 0.15s ease, filter 0.15s ease;
            cursor: pointer;
        }

        .image-button:hover {
            filter: brightness(1.08);
        }

        .image-button:active {
            transform: scale(0.97);
        }
    </style>
